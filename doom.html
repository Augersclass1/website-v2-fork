<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f00;font-family:Arial,sans-serif}
    body{display:grid;place-items:center}
    .doom{text-align:center}
    h1{font-size:clamp(64px,18vw,180px);margin:0;font-weight:900;letter-spacing:10px;text-shadow:0 0 20px #f00}
    p{font-size:clamp(18px,4vw,32px)}
  </style>
</head>
<body>
  <main class="doom">
    <h1>DOOM</h1>
    <p>Too many incorrect attempts.</p>
  </main>
</body>
</html>
